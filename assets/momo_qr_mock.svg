<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="300" height="400" rx="20" fill="#0d111d" stroke="#262f45" stroke-width="1.5"/>
  
  <!-- Header Momo Brand -->
  <text x="150" y="45" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">MOMO DONATE</text>
  <text x="150" y="65" font-family="'Outfit', sans-serif" font-weight="400" font-size="11" fill="#d82d8b" text-anchor="middle">VÍ ĐIỆN TỬ - STEVE CUTNOS</text>
  
  <!-- QR Code Frame -->
  <rect x="50" y="100" width="200" height="200" rx="15" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
  
  <!-- QR Code Elements (Simulated grid) -->
  <g fill="#0c101b">
    <!-- Finder patterns (corners) -->
    <rect x="65" y="115" width="40" height="40" rx="4"/>
    <rect x="73" y="123" width="24" height="24" rx="2" fill="#ffffff"/>
    <rect x="79" y="129" width="12" height="12" rx="1"/>
    
    <rect x="195" y="115" width="40" height="40" rx="4"/>
    <rect x="203" y="123" width="24" height="24" rx="2" fill="#ffffff"/>
    <rect x="209" y="129" width="12" height="12" rx="1"/>
    
    <rect x="65" y="245" width="40" height="40" rx="4"/>
    <rect x="73" y="247" width="24" height="24" rx="2" fill="#ffffff"/>
    <rect x="79" y="253" width="12" height="12" rx="1"/>
    
    <!-- Small mock data pixels -->
    <rect x="120" y="115" width="10" height="15" rx="1"/>
    <rect x="145" y="115" width="15" height="10" rx="1"/>
    <rect x="175" y="120" width="10" height="10" rx="1"/>
    
    <rect x="120" y="135" width="20" height="10" rx="1"/>
    <rect x="150" y="130" width="10" height="15" rx="1"/>
    <rect x="165" y="135" width="20" height="10" rx="1"/>
    
    <rect x="115" y="160" width="25" height="20" rx="1"/>
    <rect x="150" y="165" width="20" height="10" rx="1"/>
    <rect x="180" y="165" width="10" height="25" rx="1"/>
    
    <rect x="65" y="180" width="15" height="15" rx="1"/>
    <rect x="90" y="180" width="15" height="10" rx="1"/>
    
    <rect x="210" y="180" width="15" height="25" rx="1"/>
    <rect x="230" y="190" width="10" height="10" rx="1"/>
    
    <rect x="120" y="205" width="10" height="20" rx="1"/>
    <rect x="140" y="220" width="30" height="10" rx="1"/>
    <rect x="185" y="215" width="20" height="15" rx="1"/>
    
    <rect x="120" y="245" width="15" height="25" rx="1"/>
    <rect x="145" y="255" width="25" height="10" rx="1"/>
    <rect x="180" y="250" width="10" height="15" rx="1"/>
    <rect x="200" y="245" width="35" height="15" rx="1"/>
    
    <rect x="120" y="280" width="40" height="10" rx="1"/>
    <rect x="170" y="275" width="15" height="15" rx="1"/>
    
    <!-- Small design logo center -->
    <rect x="135" y="185" width="30" height="30" rx="8" fill="#d82d8b"/>
    <text x="150" y="205" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">M</text>
  </g>
  
  <!-- Footer Info -->
  <text x="150" y="340" font-family="'Outfit', sans-serif" font-weight="500" font-size="12" fill="#a0aec0" text-anchor="middle">Số điện thoại: 0368 346 379</text>
  <text x="150" y="360" font-family="'Outfit', sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle">MOMO - NGUYEN THANH SON</text>
  <text x="150" y="378" font-family="'Outfit', sans-serif" font-weight="400" font-size="10" fill="#718096" text-anchor="middle">Quét để gửi lời động viên và ủng hộ!</text>
</svg>

  <text x="150" y="340" font-family="'Outfit', sans-serif" font-weight="500" font-size="12" fill="#a0aec0" text-anchor="middle">Số tài khoản: 0588484810</text>
  <text x="150" y="360" font-family="'Outfit', sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle">VPBANK - NGUYEN THANH SON</text>
  <text x="150" y="378" font-family="'Outfit', sans-serif" font-weight="400" font-size="10" fill="#718096" text-anchor="middle">Cảm ơn sự đóng góp của bạn!</text>

    <rect x="140" y="115" width="20" height="10" rx="1"/>
    <rect x="170" y="115" width="10" height="20" rx="1"/>
    
    <rect x="120" y="130" width="15" height="10" rx="1"/>
    <rect x="145" y="135" width="10" height="10" rx="1"/>
    <rect x="160" y="140" width="25" height="10" rx="1"/>
    
    <rect x="115" y="160" width="30" height="15" rx="1"/>
    <rect x="155" y="165" width="15" height="25" rx="1"/>
    <rect x="180" y="160" width="20" height="10" rx="1"/>
    
    <rect x="65" y="180" width="10" height="30" rx="1"/>
    <rect x="85" y="185" width="20" height="10" rx="1"/>
    
    <rect x="210" y="180" width="25" height="15" rx="1"/>
    <rect x="220" y="205" width="15" height="20" rx="1"/>
    
    <rect x="120" y="210" width="20" height="25" rx="1"/>
    <rect x="150" y="220" width="35" height="10" rx="1"/>
    <rect x="195" y="235" width="10" height="15" rx="1"/>
    
    <rect x="125" y="255" width="30" height="15" rx="1"/>
    <rect x="165" y="250" width="15" height="30" rx="1"/>
    <rect x="190" y="260" width="45" height="10" rx="1"/>
    
